name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            node:
              - 'package.json'
              - 'package-lock.json'
              - '.prettierignore'
              - '.prettierrc'
              - 'eslint.config.js'
              - 'knip.json'
              - 'stylelint.config.js'
              - '.github/workflows/ci.yml'
              - '**/*.{css,js,json,mjs,ts,tsx,yaml,yml}'
              - 'apps/desktop/package.json'
              - 'apps/desktop/index.html'
              - 'apps/desktop/public/**'
              - 'apps/desktop/src/**'
              - 'apps/desktop/tsconfig*.json'
              - 'apps/desktop/vite.config.ts'
            rust:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/**'
              - 'apps/cli/**'
              - 'scripts/ci/**'
              - 'scripts/resources/**'
              - '.github/workflows/ci.yml'
            tauri:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/**'
              - 'apps/desktop/src-tauri/**'
              - 'scripts/ci/**'
              - 'scripts/resources/**'
              - '.github/workflows/ci.yml'
            native:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'native/audio-engine/**'
              - 'crates/riffra-runtime/src/audio/**'
              - 'crates/riffra-runtime/src/binaries.rs'
              - 'crates/riffra-runtime/src/host/audio.rs'
              - 'crates/riffra-runtime/src/host/lifecycle.rs'
              - 'crates/riffra-runtime/src/startup.rs'
              - 'scripts/ci/headless-host-process.*'
              - 'scripts/resources/prepare-builtin.mjs'
              - 'apps/desktop/src-tauri/tauri.conf.json'
              - 'apps/desktop/src-tauri/binaries/**'
              - 'apps/desktop/src-tauri/resources/**'
              - '.github/workflows/ci.yml'

    outputs:
      node: ${{ steps.filter.outputs.node }}
      rust: ${{ steps.filter.outputs.rust }}
      tauri: ${{ steps.filter.outputs.tauri }}
      native: ${{ steps.filter.outputs.native }}

  node:
    name: Node
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run knip
      - run: npm run check

  rust:
    name: Rust host crates
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-host-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-host-

      - run: cargo fmt --manifest-path Cargo.toml --all --check
      - run: cargo clippy --manifest-path Cargo.toml --workspace --exclude riffra-desktop --all-targets -- -D warnings
      - run: cargo test --manifest-path Cargo.toml --workspace --exclude riffra-desktop

      - name: Stage built-in instrument resources
        shell: bash
        run: |
          resource_root="$RUNNER_TEMP/riffra-resources"
          node scripts/resources/prepare-builtin.mjs --destination "$resource_root"
          echo "RIFFRA_BUILTIN_INSTRUMENTS_ROOT=$resource_root/instruments/builtin" >> "$GITHUB_ENV"

      - name: Exercise headless Host
        shell: bash
        run: bash scripts/ci/headless-host-process.sh

  rust-tauri:
    name: Rust Tauri
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.tauri == 'true'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Native sidecars are exercised by the native job. The Tauri crate tests
      # do not package or execute those binaries, so this job stays independent.

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-tauri-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-tauri-

      - run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Stage built-in instrument resources
        shell: pwsh
        run: |
          $resourceRoot = Join-Path $env:RUNNER_TEMP 'riffra-resources'
          node scripts/resources/prepare-builtin.mjs --destination $resourceRoot
          "RIFFRA_BUILTIN_INSTRUMENTS_ROOT=$(Join-Path $resourceRoot 'instruments\builtin')" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Exercise headless Host
        shell: pwsh
        run: .\scripts\ci\headless-host-process.ps1

  native-linux:
    name: Native audio engine (Linux)
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install Linux dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            clang-format \
            libasound2-dev \
            libegl-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libglu1-mesa-dev \
            libxi-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            mesa-common-dev \
            pkg-config

      - uses: actions/cache@v6
        with:
          path: native/audio-engine/build/_deps
          key: ${{ runner.os }}-native-deps-${{ hashFiles('native/audio-engine/CMakeLists.txt') }}

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/audio-engine/build/sonalloy-cargo-target
            native/audio-engine/build/sonalloy-capi
          key: ${{ runner.os }}-native-sonalloy-debug-${{ hashFiles('native/audio-engine/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-native-sonalloy-debug-

      - name: Check clang-format
        shell: bash
        run: |
          mapfile -t files < <(
            git ls-files native/audio-engine/src native/audio-engine/tests |
              grep -E '\.(c|cc|cpp|cxx|h|hh|hpp|hxx|mm|m)$'
          )
          if (( ${#files[@]} == 0 )); then
            echo 'No C++ source files were found.' >&2
            exit 1
          fi
          clang-format --style=file --dry-run --Werror "${files[@]}"

      - name: Build and test on Linux
        shell: bash
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 4
          CTEST_PARALLEL_LEVEL: 4
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: 'true'
        run: ./native/audio-engine/build.sh Debug

      - name: Exercise normal headless Host with native sidecars
        shell: bash
        env:
          RIFFRA_HEADLESS_SAFE_MODE: '0'
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: 'true'
        run: bash scripts/ci/headless-host-process.sh

  native-windows:
    name: Native audio engine (Windows)
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.native == 'true'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: mozilla-actions/sccache-action@v0.0.11

      - uses: actions/cache@v6
        with:
          path: native/audio-engine/build/_deps
          key: ${{ runner.os }}-native-deps-${{ hashFiles('native/audio-engine/CMakeLists.txt') }}

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/audio-engine/build/sonalloy-cargo-target
            native/audio-engine/build/sonalloy-capi
          key: ${{ runner.os }}-native-sonalloy-debug-${{ hashFiles('native/audio-engine/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-native-sonalloy-debug-

      - name: Build and test on Windows
        shell: pwsh
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 4
          CTEST_PARALLEL_LEVEL: 4
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: 'true'
        run: .\native\audio-engine\build.ps1 -Configuration Debug

      - name: Exercise normal headless Host with native sidecars
        shell: pwsh
        env:
          RIFFRA_HEADLESS_SAFE_MODE: '0'
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: 'true'
        run: .\scripts\ci\headless-host-process.ps1

  native-macos:
    name: Native audio engine (macOS arm64)
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.native == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: mozilla-actions/sccache-action@v0.0.11

      - uses: actions/cache@v6
        with:
          path: native/audio-engine/build/_deps
          key: ${{ runner.os }}-native-deps-${{ hashFiles('native/audio-engine/CMakeLists.txt') }}

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/audio-engine/build/sonalloy-cargo-target
            native/audio-engine/build/sonalloy-capi
          key: ${{ runner.os }}-native-sonalloy-${{ github.event_name == 'pull_request' && 'debug' || 'release' }}-${{ hashFiles('native/audio-engine/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-native-sonalloy-${{ github.event_name == 'pull_request' && 'debug' || 'release' }}-

      - name: Build, test, and package on macOS
        shell: bash
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 4
          CTEST_PARALLEL_LEVEL: 4
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
          MACOSX_DEPLOYMENT_TARGET: '14.0'
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: 'true'
        run: |
          if [[ "$GITHUB_EVENT_NAME" == 'pull_request' ]]; then
            ./native/audio-engine/build.sh Debug
          else
            ./native/audio-engine/build.sh Release
          fi

      - name: Verify Debug package resources
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          test -x target/debug/riffra-audio
          test -x target/debug/riffra-plugin-scan
          test -x target/debug/riffra-render
          test -x apps/desktop/src-tauri/binaries/riffra-audio-aarch64-apple-darwin
          test -x apps/desktop/src-tauri/binaries/riffra-plugin-scan-aarch64-apple-darwin
          test -x apps/desktop/src-tauri/binaries/riffra-render-aarch64-apple-darwin
          test -f target/debug/riffra-resources/instruments/builtin/manifest.json
          test -f target/debug/riffra-resources/THIRD_PARTY_NOTICES.md
          test -f apps/desktop/src-tauri/resources/instruments/builtin/manifest.json
          test -f apps/desktop/src-tauri/resources/THIRD_PARTY_NOTICES.md
          test -f apps/desktop/src-tauri/resources/LICENSE-MIT
          test -f apps/desktop/src-tauri/resources/LICENSE-APACHE

      - name: Verify Release package resources
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          test -x target/release/riffra-audio
          test -x target/release/riffra-plugin-scan
          test -x target/release/riffra-render
          test -x apps/desktop/src-tauri/binaries/riffra-audio-aarch64-apple-darwin
          test -x apps/desktop/src-tauri/binaries/riffra-plugin-scan-aarch64-apple-darwin
          test -x apps/desktop/src-tauri/binaries/riffra-render-aarch64-apple-darwin
          test -f target/release/riffra-resources/instruments/builtin/manifest.json
          test -f target/release/riffra-resources/THIRD_PARTY_NOTICES.md
          test -f apps/desktop/src-tauri/resources/instruments/builtin/manifest.json
          test -f apps/desktop/src-tauri/resources/THIRD_PARTY_NOTICES.md
          test -f apps/desktop/src-tauri/resources/LICENSE-MIT
          test -f apps/desktop/src-tauri/resources/LICENSE-APACHE
