[package]
name = "riffra-runtime"
version = "0.1.0"
description = "Shared live Riffra DAW host runtime"
authors = ["Riffra contributors"]
edition = "2024"
rust-version = "1.88"

[dependencies]
riffra-control = { path = "../riffra-control" }
riffra-core = { path = "../riffra-core" }
riffra-host = { path = "../riffra-host" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1.20"
thiserror = "2"
tracing = "0.1"
ts-rs = "12"
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1.23", features = ["v7"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "1.1.5", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }
