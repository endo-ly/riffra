[package]
name = "riffra-core"
version = "0.1.0"
description = "Platform-independent Riffra production domain and application core"
authors = ["Riffra contributors"]
edition = "2024"
rust-version = "1.88"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "12"
thiserror = "2"
uuid = { version = "1.23", features = ["v7"] }
