[package]
name = "riffra-cli"
version = "0.1.0"
description = "Headless command host for the Riffra production core"
authors = ["Riffra contributors"]
edition = "2024"
rust-version = "1.88"
autobins = false

[[bin]]
name = "riffra"
path = "src/main.rs"

[dependencies]
riffra-control = { path = "../../crates/riffra-control" }
riffra-core = { path = "../../crates/riffra-core" }
riffra-host = { path = "../../crates/riffra-host" }
riffra-runtime = { path = "../../crates/riffra-runtime" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
