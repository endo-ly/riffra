[package]
name = "riffra-desktop"
version = "0.1.0"
description = "Windows-first integrated music production workbench"
authors = ["Riffra contributors"]
edition = "2024"
rust-version = "1.88"

[lib]
name = "riffra_desktop_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
# §4.3.2 Tauriコマンド契約のIPC結合テストを明示的に有効化する。
# 通常テストとWindows固有のIPC実行環境を分離するためのオプトイン機能。
# `--no-run` はコンパイル確認であり、IPC実行確認には専用Windows環境が必要。
ipc-integration = ["tauri/test"]

[dependencies]
riffra-control = { path = "../../../crates/riffra-control" }
riffra-core = { path = "../../../crates/riffra-core" }
riffra-host = { path = "../../../crates/riffra-host" }
riffra-runtime = { path = "../../../crates/riffra-runtime" }
riffra-render-worker = { path = "../../../crates/riffra-render-worker" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["macros", "sync", "time"] }
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1.23", features = ["v7"] }
tracing = "0.1"
ts-rs = "12"
